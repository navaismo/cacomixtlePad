name: Android checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout Flutter 3.29.3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flutter/flutter
          ref: ea121f8859e4b13e47a8f845e4586164519588bc
          path: .ci-flutter-sdk
          persist-credentials: false

      - name: Put Flutter outside the application checkout
        run: |
          mv .ci-flutter-sdk "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Prepare SDK and locked dependencies
        run: |
          flutter config --no-analytics
          flutter precache --android
          flutter pub get --enforce-lockfile

      - name: Check source formatting and translations
        run: |
          dart format --output=none --set-exit-if-changed lib/main.dart lib/pages lib/services lib/widgets test
          python3 tool/check_translations.py
          bash -n tool/create_release_key.sh

      - name: Analyze and test
        run: |
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded

      - name: Build test APK
        run: flutter build apk --debug --no-pub

      - name: Validate release signing with an ephemeral certificate
        run: python3 tool/validate_release_signing.py

      - name: Upload test APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cacomixtlepad-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
